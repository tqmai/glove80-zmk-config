# Dongle setup: both halves become split peripherals and the dongle becomes the
# central. Without this the left half keeps its BOARD_GLOVE80_LH default of
# ZMK_SPLIT_ROLE_CENTRAL=y and fights the dongle for the right half.
# This file is applied to both halves; the right half is already a peripheral,
# so setting it there is a no-op.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

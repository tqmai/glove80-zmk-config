name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Glove80 combined firmware
        run: nix-build config -o combined
      - name: Copy result out of nix store
        # Named to keep it distinct from a normal Glove80 build: this one is
        # peripheral-only firmware and does nothing without the dongle.
        run: cp combined/glove80.uf2 glove80-peripheral.uf2
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: glove80-peripheral.uf2
          path: glove80-peripheral.uf2
